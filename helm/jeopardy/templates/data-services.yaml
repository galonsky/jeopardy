apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
  ports: [{ name: postgres, port: 5432, targetPort: postgres }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: postgres } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: postgres }
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }} }
            - { name: POSTGRES_USER, value: {{ .Values.postgres.username | quote }} }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Values.secretName }}, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: [pg_isready, -U, {{ .Values.postgres.username | quote }}, -d, {{ .Values.postgres.database | quote }}] }, initialDelaySeconds: 5 }
          livenessProbe: { exec: { command: [pg_isready, -U, {{ .Values.postgres.username | quote }}, -d, {{ .Values.postgres.database | quote }}] }, initialDelaySeconds: 20 }
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.postgres.persistence.size }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-valkey
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: valkey }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-valkey
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  serviceName: {{ .Release.Name }}-valkey
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: valkey } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: valkey }
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          args: [valkey-server, --appendonly, "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          volumeMounts: [{ name: data, mountPath: /data }]
          readinessProbe: { exec: { command: [valkey-cli, ping] }, initialDelaySeconds: 3 }
          livenessProbe: { exec: { command: [valkey-cli, ping] }, initialDelaySeconds: 10 }
          resources: {{- toYaml .Values.valkey.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.valkey.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests: { storage: {{ .Values.valkey.persistence.size }} }
