{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ .Release.Name }}-worker
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  scaleTargetRef: { name: {{ .Release.Name }}-worker }
  minReplicaCount: 0
  maxReplicaCount: 4
  triggers:
    - type: cpu
      metricType: Utilization
      metadata: { value: "75" }
    - type: redis-streams
      metadata:
        address: {{ printf "%s-valkey:6379" .Release.Name | quote }}
        stream: jeopardy
        consumerGroup: jeopardy-workers
        lagCount: "5"
        activationLagCount: "1"
        databaseIndex: "2"
{{- end }}

