apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  annotations: { argocd.argoproj.io/sync-wave: "2" }
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 1
  selector: { matchLabels: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: api } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001 }
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server]
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: DJANGO_SETTINGS_MODULE, value: {{ .Values.djangoSettingsModule | quote }} }
            - { name: ALLOWED_HOSTS, value: {{ .Values.host | quote }} }
            - { name: DATABASE_URL, value: "postgresql://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}" }
            - { name: REDIS_URL, value: "redis://{{ .Release.Name }}-valkey:6379/0" }
            - { name: TASKIQ_REDIS_URL, value: "redis://{{ .Release.Name }}-valkey:6379/0" }
            - { name: REDIS_DB_BASE, value: "0" }
            - { name: CLASSIFICATION_MODEL, value: {{ .Values.classificationModel | quote }} }
            - { name: TSIDP_ISSUER, value: {{ .Values.tsidpIssuer | quote }} }
            - { name: TSIDP_CLIENT_ID, value: {{ .Values.tsidpClientId | quote }} }
            - { name: ALLOWED_IDENTITY, value: {{ .Values.allowedIdentity | quote }} }
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
          resources: {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe: { httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: {{ .Values.host | quote }} }] }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /api/health, port: http, httpHeaders: [{ name: Host, value: {{ .Values.host | quote }} }] }, initialDelaySeconds: 15 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: { app.kubernetes.io/name: {{ .Release.Name }}, app.kubernetes.io/component: api }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
  type: {{ .Values.service.type }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations: { argocd.argoproj.io/sync-wave: "1", argocd.argoproj.io/hook: Sync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [migrate]
          env:
            - { name: DATABASE_URL, value: "postgresql://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/{{ .Values.postgres.database }}" }
            - { name: DJANGO_SETTINGS_MODULE, value: {{ .Values.djangoSettingsModule | quote }} }
            - { name: TSIDP_ISSUER, value: {{ .Values.tsidpIssuer | quote }} }
            - { name: TSIDP_CLIENT_ID, value: {{ .Values.tsidpClientId | quote }} }
            - { name: ALLOWED_IDENTITY, value: {{ .Values.allowedIdentity | quote }} }
          envFrom: [{ secretRef: { name: {{ .Values.secretName }} } }]
---
