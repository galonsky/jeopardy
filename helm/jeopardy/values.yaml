image:
  repository: jeopardy-study
  tag: local
  pullPolicy: IfNotPresent
replicaCount: 1
host: jeopardy.example.invalid
service:
  type: ClusterIP
  port: 8000
secretName: jeopardy-secrets
djangoSettingsModule: config.settings.prod
postgres:
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  database: jeopardy
  username: jeopardy
  persistence:
    size: 5Gi
    storageClassName: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
valkey:
  image:
    repository: valkey/valkey
    tag: "8-alpine"
    pullPolicy: IfNotPresent
  persistence:
    size: 1Gi
    storageClassName: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
classificationModel: ""
keda:
  enabled: false
tsidpIssuer: https://idp.example.invalid
tsidpClientId: replace-me
allowedIdentity: ""
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 1Gi }
